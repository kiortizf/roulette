<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="50%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Big popcorn emoji -->
  <text x="150" y="400" font-size="280">🍿</text>

  <!-- Title -->
  <text x="480" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="bold" fill="white">
    Popcorn Panic
  </text>

  <!-- Tagline -->
  <text x="480" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="40" fill="white" opacity="0.9">
    Stop arguing. Start spinning.
  </text>

  <!-- Subtitle -->
  <text x="480" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white" opacity="0.7">
    Movie Night Roulette
  </text>

  <!-- Decorative emojis -->
  <text x="1050" y="150" font-size="60">🎬</text>
  <text x="1080" y="520" font-size="50">🎲</text>
</svg>
